<!DOCTYPE html>
<html>
    <head>
        <title>ToDo List</title>
        <link rel="stylesheet" href="ToDo List.css">
    </head>
    <body>
        <div class="masterContainer">

            <header>
                <p class="title">
                    To-Do List 
                </p>
            </header>

            <div class="mainContainer">
                <input type="text" class="taskInputElement" placeholder="Enter Your Task">
                <input type="date" class="dateInputElement">
            
                <button class="addButton" onclick="insertNewTask()"
                >Add</button>
            </div>
            
            <div class="taskDisplayContainer">
            </div>
        </div>

        <script src="ToDo List.js">
        </script>
    </body>
</html>
